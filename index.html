<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>V-STRIKE 3D</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <canvas id="c"></canvas>
  <div id="damage-vignette"></div>
  <div id="scope-overlay"></div>

  <!-- Valorant Kill Banner -->
  <div id="kill-banner">
    <div class="kill-skull">&#9760;</div>
    <div class="kill-text" id="kill-banner-text">KILL</div>
  </div>

  <!-- Scoreboard Overlay (Press T) -->
  <div id="scoreboard-modal">
    <div class="sb-card">
      <div class="sb-header">MATCH LEADERBOARD (PRESS T TO CLOSE)</div>
      <table id="sb-table">
        <thead>
          <tr>
            <th>AGENT</th>
            <th>K</th>
            <th>D</th>
            <th>A</th>
          </tr>
        </thead>
        <tbody id="sb-rows"></tbody>
      </table>
    </div>
  </div>

  <!-- Settings Menu Modal -->
  <div id="settings-modal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <span>SETTINGS</span>
        <button id="btn-close-settings" class="close-x-btn">&times;</button>
      </div>
      <div class="settings-body">
        <div class="setting-row">
          <span id="sens-label">SENS: 1.00x</span>
          <input type="range" id="sens-slider" min="0.1" max="3.0" step="0.05" value="1.0" />
        </div>
        
        <!-- Mobile Aim Assist Toggle -->
        <div class="setting-row" id="setting-aim-assist-row">
          <label>Aim Assist (Mobile)</label>
          <button id="btn-toggle-aimassist" class="toggle-pill active">ENABLED</button>
        </div>

        <!-- Crosshair Selector -->
        <div class="setting-row column-layout">
          <label>Crosshair Style</label>
          <div class="crosshair-grid">
            <button class="ch-select-btn active" data-ch="plus">1. Plus</button>
            <button class="ch-select-btn" data-ch="dot">2. Small Dot</button>
            <button class="ch-select-btn" data-ch="tenz">3. Tenz</button>
            <button class="ch-select-btn" data-ch="headhunter">4. Head Hunter</button>
            <button class="ch-select-btn" data-ch="spray">5. Spray</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Lobby Overlay -->
  <div id="lobby">
    <div class="title">V-STRIKE</div>
    <div class="card">
      <input type="text" id="player-name" placeholder="Agent Name" maxlength="10" />
      <input type="text" id="room-input" placeholder="Room Code (e.g. BIND)" maxlength="6" />
      
      <div class="platform-toggle">
        <button type="button" class="mode-btn active" data-mode="online">ONLINE MULTIPLAYER</button>
        <button type="button" class="mode-btn" data-mode="offline">OFFLINE (BOTS)</button>
      </div>

      <div class="platform-toggle">
        <button type="button" class="plat-btn active" data-plat="mobile">MOBILE</button>
        <button type="button" class="plat-btn" data-plat="pc">PC (WASD)</button>
      </div>

      <button class="btn" id="btn-join">Start Game</button>
    </div>
  </div>

  <!-- In-game HUD -->
  <div id="hud">
    <div class="top-bar">
      <div id="ping-val" class="hud-pill ping-pill">PING: 24ms</div>

      <button id="btn-swap-weapon" class="hud-pill">WEAPON: RIFLE</button>
      <button id="btn-tab-toggle" class="hud-pill">[T] SCORES</button>
      <button id="btn-gyro" class="hud-pill">GYRO: OFF</button>
      <button id="btn-open-settings" class="hud-pill">⚙ SETTINGS</button>
      
      <div id="killfeed"></div>
    </div>

    <!-- Dynamic Crosshairs -->
    <div id="crosshair" class="ch-style-plus">
      <div class="ch-line ch-t"></div>
      <div class="ch-line ch-b"></div>
      <div class="ch-line ch-l"></div>
      <div class="ch-line ch-r"></div>
      <div class="ch-dot"></div>
    </div>

    <div id="death-screen">
      <div class="elim-title">ELIMINATED</div>
      <div class="respawn-timer" id="respawn-text">RESPAWNING IN 3...</div>
    </div>

    <div class="bottom-hud">
      <div class="stat-box">HP <span id="hp-val" class="hp-val">100</span></div>
      <div class="stat-box">SLOT <span id="slot-val" class="slot-val">RIFLE</span></div>
      <div class="stat-box">DASH <span id="dash-val" class="dash-val">READY [E]</span></div>
      <div class="stat-box">AMMO <span id="ammo-val" class="ammo-val">25/25</span></div>
    </div>
  </div>

  <!-- Mobile Controls Layer -->
  <div id="mobile-controls">
    <div id="move-zone" class="touch-zone"></div>
    <div id="look-zone" class="touch-zone"></div>
    <div id="joystick-base"><div id="joystick-stick"></div></div>
    
    <button id="btn-fire" class="action-btn">FIRE</button>
    <button id="btn-scope" class="action-btn">AIM</button>
    <button id="btn-reload" class="action-btn">R</button>
    <button id="btn-jump" class="action-btn">JUMP</button>
    <button id="btn-dash" class="action-btn">DASH</button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
