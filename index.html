<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>V-STRIKE 3D - Home</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top Authenticated User Indicator -->
  <div id="user-bar" class="user-status-bar" style="display: none;">
    <span>🟢 Agent: <strong id="display-username"></strong></span>
  </div>

  <!-- SCREEN 1: First Login / Username Sign In -->
  <div id="screen-signin" class="app-screen">
    <div class="glossy-card">
      <div class="title-glow">V-STRIKE</div>
      <div class="subtitle">ENTER OPERATIVE CREDENTIALS</div>
      <input type="text" id="username-input" class="glossy-input" placeholder="Enter Username..." maxlength="12" autocomplete="off" />
      <button id="btn-signin" class="glossy-btn">SIGN IN & CONTINUE</button>
    </div>
  </div>

  <!-- SCREEN 2: Main Screen (Play & Information + Video box mapping your drawing) -->
  <div id="screen-main" class="app-screen">
    <div class="dashboard-grid">
      <div class="glossy-card" style="max-width: 100%;">
        <div class="title-glow">V-STRIKE 3D</div>
        <div class="subtitle">TACTICAL BROWSER MULTIPLAYER</div>
        
        <div class="video-preview-box"></div>
        
        <div style="display: flex; gap: 15px; margin-top: 10px;">
          <button id="btn-goto-device" class="glossy-btn" style="flex: 2;">PLAY GAME</button>
          <button id="btn-signout" class="glossy-btn secondary" style="flex: 1;">SWITCH USER</button>
        </div>
      </div>
    </div>
  </div>

  <!-- SCREEN 3: Choose Your Device (PC or Mobile) -->
  <div id="screen-device" class="app-screen">
    <div class="glossy-card">
      <div class="title-glow" style="font-size: 1.8rem;">CHOOSE DEVICE</div>
      <div class="subtitle">OPTIMIZE CONTROLS & RENDERING</div>
      
      <div class="device-options">
        <div class="device-card" data-device="pc">
          <div class="device-icon">💻</div>
          <div style="font-weight: bold; color: #fff;">PC WORKSTATION</div>
        </div>
        <div class="device-card" data-device="mobile">
          <div class="device-icon">📱</div>
          <div style="font-weight: bold; color: #fff;">MOBILE DEVICE</div>
        </div>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button id="btn-back-main" class="glossy-btn secondary" style="flex: 1;">BACK</button>
        <button id="btn-goto-code" class="glossy-btn" style="flex: 2;" disabled>NEXT</button>
      </div>
    </div>
  </div>

  <!-- SCREEN 4: Enter Room Code / Create Room -->
<!-- SCREEN 4: Enter Room Code / Create Room -->
<div id="screen-code" class="app-screen">
  <div class="glossy-card">
    <div class="title-glow" style="font-size: 1.8rem;">ROOM ACCESS</div>
    <div class="subtitle">ENTER CODE OR CREATE NEW ROOM</div>
    
    <input type="text" id="room-code-input" class="glossy-input" placeholder="ROOM CODE (E.G. 1300)" maxlength="6" style="text-align: center; letter-spacing: 2px;" />
    
    <div style="display: flex; gap: 10px;">
      <button id="btn-back-device" class="glossy-btn secondary" style="flex: 1;">BACK</button>
      <button id="btn-launch-game" class="glossy-btn" style="flex: 2;">ENTER MATCH</button>
    </div>
  </div>
</div>

<script src="storage.js"></script>
<script type="module">
  import { launchGameEngine } from './app.js';

  document.addEventListener('DOMContentLoaded', () => {
    const screens = {
      signin: document.getElementById('screen-signin'),
      main: document.getElementById('screen-main'),
      device: document.getElementById('screen-device'),
      code: document.getElementById('screen-code')
    };

    const userBar = document.getElementById('user-bar');
    const displayUsername = document.getElementById('display-username');
    let selectedDevice = 'mobile'; // Default fallback

    function switchScreen(targetName) {
      Object.values(screens).forEach(screen => screen.classList.remove('active'));
      screens[targetName].classList.add('active');

      const currentUsername = StorageManager.getUsername();
      if (currentUsername && targetName !== 'signin') {
        userBar.style.display = 'flex';
        displayUsername.innerText = currentUsername;
      } else {
        userBar.style.display = 'none';
      }
    }

    // Init check
    if (!StorageManager.getUsername()) {
      switchScreen('signin');
    } else {
      switchScreen('main');
    }

    document.getElementById('btn-signin').addEventListener('click', () => {
      const val = document.getElementById('username-input').value;
      if (StorageManager.setUsername(val)) {
        switchScreen('main');
      } else {
        alert('Please provide a valid username.');
      }
    });

    document.getElementById('btn-signout').addEventListener('click', () => {
      StorageManager.clearUsername();
      document.getElementById('username-input').value = '';
      switchScreen('signin');
    });

    document.getElementById('btn-goto-device').addEventListener('click', () => {
      switchScreen('device');
    });

    document.querySelectorAll('.device-card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.device-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedDevice = card.getAttribute('data-device');
        document.getElementById('btn-goto-code').removeAttribute('disabled');
      });
    });

    document.getElementById('btn-back-main').addEventListener('click', () => switchScreen('main'));
    document.getElementById('btn-goto-code').addEventListener('click', () => {
      if (selectedDevice) switchScreen('code');
    });
    document.getElementById('btn-back-device').addEventListener('click', () => switchScreen('device'));

    // LAUNCH MATCH TRIGGER
    document.getElementById('btn-launch-game').addEventListener('click', () => {
      const roomCode = document.getElementById('room-code-input').value.trim().toUpperCase() || 'MAIN';
      const username = StorageManager.getUsername();

      // Hide all HTML menu screens completely
      Object.values(screens).forEach(screen => screen.style.display = 'none');
      document.getElementById('user-bar').style.display = 'none';

      // Call our exported game engine bootloader in app.js
      launchGameEngine({
        username: username,
        platform: selectedDevice, // 'pc' or 'mobile'
        room: roomCode
      });
    });
  });
</script>
</body>
</html>
